[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkergen"
version = "0.1.0"
description = "Generative models for reticular chemistry organic linkers."
requires-python = ">=3.9"
dependencies = [
    "torch",
    "pandas",
    "numpy",
    "tqdm",
    "rdkit",
    "transformers",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
linkergen-train = "linkergen.train:main"
linkergen-sample = "linkergen.sample:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linkergen"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "network: needs network access to download the nach0 model from Hugging Face; skipped by default",
]
addopts = "-m 'not network'"
